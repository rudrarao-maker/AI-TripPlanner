services:
  # Backend Web Service
  - type: web
    name: trip-planner-backend
    env: node
    buildCommand: "cd server && npm install && npx prisma generate && npm run build"
    startCommand: "cd server && npx prisma db push --accept-data-loss && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard — NEVER commit DB URL
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    
  # Frontend Static Site
  - type: web
    name: trip-planner-frontend
    env: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your backend URL (without /api/v1)
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
