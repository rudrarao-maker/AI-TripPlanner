services:
  # Backend Web Service
  - type: web
    name: trip-planner-backend
    env: node
    buildCommand: "cd server && npm install && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "file:./dev.db" # Can be updated to PostgreSQL in Render
      - key: JWT_SECRET
        value: "super_secret_jwt_key_update_me"
      - key: GEMINI_API_KEY
        value: "your_gemini_api_key_here"
      - key: RAPIDAPI_KEY
        value: "your_rapidapi_key_here"
    
  # Frontend Static Site
  - type: web
    name: trip-planner-frontend
    env: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://trip-planner-backend.onrender.com/api/v1"
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: "your_google_maps_key"
